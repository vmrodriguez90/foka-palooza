<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Anton';src:url('fonts/Anton.ttf') format('truetype');font-weight:400}
  @font-face{font-family:'Bebas Neue';src:url('fonts/BebasNeue.ttf') format('truetype');font-weight:400}
</style>
<style>
  /* ==================================================================
     Foto de perfil del grupo de WhatsApp — 1000×1000.
     WhatsApp la recorta en CÍRCULO y la muestra chiquita (48-64px en la
     lista de chats), así que:
       · todo lo importante vive adentro del círculo inscripto,
       · la foca es lo único que tiene que leerse a 64px,
       · el texto es para cuando abrís la info del grupo, donde se ve grande.
     ================================================================== */
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1000px;height:1000px;overflow:hidden;background:#062C30}
  .card{position:relative;width:1000px;height:1000px;overflow:hidden}

  /* el fondo llega hasta los bordes: si WhatsApp recorta cuadrado, no hay esquinas vacías */
  .rays{
    position:absolute;inset:-30%;
    background:repeating-conic-gradient(from 6deg at 50% 48%,
      rgba(27,107,115,.75) 0deg 11deg, transparent 11deg 22deg);
  }
  .glow{
    position:absolute;inset:0;
    background:
      radial-gradient(60% 50% at 50% 40%, rgba(79,189,187,.34), transparent 70%),
      radial-gradient(90% 90% at 50% 105%, rgba(6,44,48,.97), rgba(6,44,48,.25) 70%);
  }
  /* aro coral: marca el recorte circular y le da borde a la miniatura */
  .aro{
    position:absolute;inset:26px;
    border-radius:50%;
    border:14px solid #FF7A59;
    box-shadow:inset 0 0 0 10px rgba(6,44,48,.55);
  }

  .contenido{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

  .seal{width:625px;margin-top:-70px;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}

  /* Sin el nombre escrito: WhatsApp ya muestra "Foka Palooza 2026" al
     lado de la foto, y a 48px una tipografía chica es un borrón.
     Queda el año, grande y corto, que sí se lee. */
  .anio{
    position:absolute;bottom:96px;left:0;right:0;text-align:center;
    font-family:'Anton',sans-serif;
    font-size:74px;line-height:1;letter-spacing:.08em;
    color:#FFD166;
    text-shadow:4px 5px 0 rgba(6,44,48,.85);
    padding-left:.08em;
  }
</style>
</head>
<body>
<div class="card">
  <div class="rays"></div><div class="glow"></div><div class="aro"></div>

  <div class="contenido">
    <!-- viewBox recortado a la cara: a 48px una carita se entiende, un cuerpo entero no -->
    <svg class="seal" viewBox="42 -26 136 152">
      <ellipse cx="110" cy="196" rx="70" ry="9" fill="#042226" opacity=".5"/>
      <path d="M110 166c-5 15-23 27-43 28 4-16 21-28 43-28z" fill="#0B3C49"/>
      <path d="M110 166c5 15 23 27 43 28-4-16-21-28-43-28z" fill="#0B3C49"/>
      <path d="M110 26c-30 0-52 21-52 50 0 17-8 33-11 51-4 25 21 43 63 43s67-18 63-43c-3-18-11-34-11-51 0-29-22-50-52-50z" fill="#1B6B73"/>
      <path d="M110 26c-30 0-52 21-52 50 0 17-8 33-11 51-3 20 11 35 38 41-16-20-22-45-22-70 0-30 16-56 47-72z" fill="#4FBDBB" opacity=".3"/>
      <ellipse cx="110" cy="138" rx="42" ry="38" fill="#E0F7F5" opacity=".15"/>
      <path d="M60 122c-13 9-20 23-19 37 1 6 7 8 11 4 11-10 17-24 18-35z" fill="#0B3C49"/>
      <path d="M160 122c13 9 20 23 19 37-1 6-7 8-11 4-11-10-17-24-18-35z" fill="#0B3C49"/>
      <circle cx="90" cy="74" r="8.5" fill="#04222E"/>
      <circle cx="130" cy="74" r="8.5" fill="#04222E"/>
      <circle cx="93" cy="70.5" r="3" fill="#E0F7F5"/>
      <circle cx="133" cy="70.5" r="3" fill="#E0F7F5"/>
      <ellipse cx="110" cy="102" rx="23" ry="15" fill="#E0F7F5" opacity=".2"/>
      <ellipse cx="110" cy="94" rx="8.5" ry="6.5" fill="#FF7A59"/>
      <path d="M110 101v5M110 106c0 5-6 8-11 4M110 106c0 5 6 8 11 4" stroke="#04222E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <g stroke="#E0F7F5" stroke-width="2.2" stroke-linecap="round" opacity=".85">
      <path d="M87 96 61 89M87 102H61M87 108l-24 7M133 96l26-7M133 102h26M133 108l24 7"/>
      </g>
      <path d="M89 33C95 19 102 5 110-8c10 13 18 27 23 41-11 6-25 7-44 0z" fill="#FFD166"/>
      <path d="M110-8c10 13 18 27 23 41-6 3-13 5-21 6z" fill="#FF7A59"/>
      <circle cx="110" cy="-11" r="7" fill="#FF7A59"/>
    </svg>

    <div class="anio">2026</div>
  </div>
</div>
</body></html>
