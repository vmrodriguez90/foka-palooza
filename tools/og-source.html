<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<style>
  @font-face{font-family:'Anton';src:url('fonts/Anton.ttf') format('truetype');font-weight:400}
  @font-face{font-family:'Bebas Neue';src:url('fonts/BebasNeue.ttf') format('truetype');font-weight:400}
</style>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1200px;height:630px;overflow:hidden;background:#062C30;font-family:'Anton',sans-serif}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;display:flex;align-items:center}
  .rays{position:absolute;inset:-60% -30%;
    background:repeating-conic-gradient(from 0deg at 46% 50%, rgba(27,107,115,.85) 0deg 7deg, transparent 7deg 14deg);
    opacity:.55}
  .glow{position:absolute;inset:0;
    background:radial-gradient(65% 70% at 40% 45%, rgba(79,189,187,.30), transparent 70%),
               radial-gradient(120% 120% at 50% 120%, rgba(6,44,48,.95), rgba(6,44,48,.35) 65%)}
  .frame{position:absolute;inset:22px;border:5px solid rgba(79,189,187,.45);border-radius:26px}
  .content{position:relative;padding:0 62px;width:820px}
  .kicker{display:inline-block;background:#FFD166;color:#062C30;font-family:'Bebas Neue',sans-serif;
    font-size:27px;letter-spacing:.30em;padding:8px 22px 4px;border-radius:99px;transform:rotate(-2deg)}
  .foka{font-size:158px;line-height:.82;color:#E0F7F5;text-transform:uppercase;margin-top:22px;
    text-shadow:8px 9px 0 #1B6B73, 16px 18px 0 rgba(6,44,48,.9)}
  .palooza{font-size:118px;line-height:.86;color:#FF7A59;text-transform:uppercase;
    text-shadow:6px 7px 0 #7d2f1e, 12px 14px 0 rgba(6,44,48,.9)}
  .dates{display:flex;gap:12px;margin-top:36px}
  .chip{white-space:nowrap;font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:.10em;color:#E0F7F5;
    border:3px solid rgba(79,189,187,.6);background:rgba(11,60,73,.75);
    padding:9px 22px 4px;border-radius:99px}
  .chip b{color:#FFD166;font-weight:400}
  .tag{white-space:nowrap;font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:.16em;color:#8FBFC2;margin-top:26px}
  .seal{position:absolute;right:44px;bottom:-4px;width:392px;filter:drop-shadow(0 22px 40px rgba(0,0,0,.55))}
</style></head>
<body>
<div class="card">
  <div class="rays"></div><div class="glow"></div><div class="frame"></div>

  <svg class="seal" viewBox="0 -18 220 228">
<ellipse cx="110" cy="196" rx="70" ry="9" fill="#042226" opacity=".5"/>
  <path d="M110 166c-5 15-23 27-43 28 4-16 21-28 43-28z" fill="#0B3C49"/>
  <path d="M110 166c5 15 23 27 43 28-4-16-21-28-43-28z" fill="#0B3C49"/>
  <path d="M110 26c-30 0-52 21-52 50 0 17-8 33-11 51-4 25 21 43 63 43s67-18 63-43c-3-18-11-34-11-51 0-29-22-50-52-50z" fill="#1B6B73"/>
  <path d="M110 26c-30 0-52 21-52 50 0 17-8 33-11 51-3 20 11 35 38 41-16-20-22-45-22-70 0-30 16-56 47-72z" fill="#4FBDBB" opacity=".3"/>
  <ellipse cx="110" cy="138" rx="42" ry="38" fill="#E0F7F5" opacity=".15"/>
  <path d="M60 122c-13 9-20 23-19 37 1 6 7 8 11 4 11-10 17-24 18-35z" fill="#0B3C49"/>
  <path d="M160 122c13 9 20 23 19 37-1 6-7 8-11 4-11-10-17-24-18-35z" fill="#0B3C49"/>
  <circle cx="90" cy="74" r="8.5" fill="#04222E"/>
  <circle cx="130" cy="74" r="8.5" fill="#04222E"/>
  <circle cx="93" cy="70.5" r="3" fill="#E0F7F5"/>
  <circle cx="133" cy="70.5" r="3" fill="#E0F7F5"/>
  <ellipse cx="110" cy="102" rx="23" ry="15" fill="#E0F7F5" opacity=".2"/>
  <ellipse cx="110" cy="94" rx="8.5" ry="6.5" fill="#FF7A59"/>
  <path d="M110 101v5M110 106c0 5-6 8-11 4M110 106c0 5 6 8 11 4" stroke="#04222E" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <g stroke="#E0F7F5" stroke-width="2.2" stroke-linecap="round" opacity=".85">
    <path d="M87 96 61 89M87 102H61M87 108l-24 7M133 96l26-7M133 102h26M133 108l24 7"/>
  </g>
  <path d="M89 33C95 19 102 5 110-8c10 13 18 27 23 41-11 6-25 7-44 0z" fill="#FFD166"/>
  <path d="M110-8c10 13 18 27 23 41-6 3-13 5-21 6z" fill="#FF7A59"/>
  <circle cx="110" cy="-11" r="7" fill="#FF7A59"/>
</svg>

  <div class="content">
    <span class="kicker">EDICIÓN 2026</span>
    <div class="foka">Foka</div>
    <div class="palooza">Palooza</div>
    <div class="dates">
      <span class="chip">VIE <b>25</b></span>
      <span class="chip">SÁB <b>26</b></span>
      <span class="chip">DOM <b>27</b></span>
      <span class="chip">SEPTIEMBRE</span>
    </div>
    <div class="tag">TRES DÍAS DE FOKA · LINEUP POR CONFIRMARSE</div>
  </div>
</div>
</body></html>
